name: Vulnerable PR Processing

on:
  pull_request:
    types: [opened, edited]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log PR Title
        run: |
          echo "Processing PR: ${{ github.event.pull_request.title }}" 

